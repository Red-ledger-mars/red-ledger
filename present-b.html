<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Red Ledger: Mars is costly</title>
  <meta name="description" content="One walk at Gale crater, Mars, and what it costs the body, step by step. Made with NASA open data.">
  <link rel="preload" href="fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/view3d.css">
  <link rel="stylesheet" href="css/present-b.css">
</head>
<body class="loading">
  <!-- The poster: everything that stays on screen. The page scrolls under it;
       the scroll position is the clock of the walk. -->
  <div id="poster">
    <div id="flood" aria-hidden="true"></div>
    <div id="disc" aria-hidden="true"></div>
    <div id="stage" aria-hidden="true"></div>
    <svg id="dial" aria-hidden="true" focusable="false"></svg>
    <p id="limit" class="small" aria-hidden="true"></p>

    <h1 id="mast" class="mast">
      <span class="kicker" id="mast-kicker">One walk at Gale crater, Mars, and what it costs the body, step by step.</span>
      <span class="giant" id="mast-giant">Mars is costly</span>
    </h1>

    <div id="till" class="till">
      <div class="paper-wrap">
        <div class="paper" id="paper" aria-live="polite">
          <p class="fine" id="loader"><span id="loader-step">Terrain</span> <span id="loader-pct">0</span>%</p>
        </div>
      </div>
    </div>
    <div class="slot" aria-hidden="true"></div>

    <p id="credit" class="small"></p>
  </div>

  <header class="bar">
    <a class="mark" href="index.html">RED LEDGER</a>
    <nav class="bar-right">
      <a class="bar-link" href="classic.html">Walk tool</a>
      <button id="play" class="play" type="button" aria-label="Play the walk" aria-pressed="false">
        <svg class="i-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4 L16 10 L6 16 Z"/></svg>
        <svg class="i-pause" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3.5" height="12"/><rect x="11.5" y="4" width="3.5" height="12"/></svg>
      </button>
    </nav>
  </header>

  <main id="chapters" aria-hidden="true"></main>

  <script type="module" src="js/present-b.js"></script>
</body>
</html>
