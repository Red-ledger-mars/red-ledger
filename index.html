<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red Ledger: what a Marswalk costs the body</title>
  <meta name="description" content="A helmet display for one Marswalk at Gale crater. Every route is priced in energy, heat, radiation dose and the way back. Made with NASA open data.">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/hud.css">
</head>
<body>
  <div id="map" aria-label="Map of the walk area at Gale crater, Mars"></div>
  <div class="visor" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark">RED LEDGER</span>
      <span class="brand-sub">Marswalk cost display</span>
    </div>
    <div class="site">
      <span class="site-name">Gale crater · Mount Sharp</span>
      <span class="site-coord" id="cursor-coord">move over the map</span>
    </div>
    <nav class="layers" id="layers" aria-label="Data layers"></nav>
  </header>

  <aside class="ledger" aria-label="Body cost along the route">
    <h2>Body ledger</h2>
    <div class="bars" id="bars"></div>
    <p class="ledger-note" id="ledger-note">Waiting for route data.</p>
  </aside>

  <aside class="target" id="target" aria-label="Selected waypoint" hidden>
    <figure id="target-photo" hidden>
      <img id="target-img" alt="">
      <button id="target-swap" type="button"></button>
      <figcaption id="target-caption"></figcaption>
    </figure>
    <div class="target-body">
      <h3 id="target-name"></h3>
      <p id="target-text"></p>
      <p class="credit" id="target-credit"></p>
    </div>
  </aside>

  <div class="legend" id="legend" aria-label="Slope legend" hidden><b>Slope</b></div>

  <section class="walk" aria-label="Route comparison and walk control">
    <div class="routes" id="routes"></div>
    <div class="scrub">
      <button id="play" type="button" disabled>Walk</button>
      <input id="progress" type="range" min="0" max="1000" value="0" disabled aria-label="Position along the route">
      <span id="progress-text" class="mono">0 m</span>
    </div>
    <canvas id="profile" height="70" aria-label="Elevation profile of the route"></canvas>
  </section>

  <footer class="foot">
    <span>Made with NASA open data.</span>
    <a href="CREDITS.md">Sources and credits</a>
    <span class="assume-key"><i></i> marks an assumption, not a measurement</span>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
